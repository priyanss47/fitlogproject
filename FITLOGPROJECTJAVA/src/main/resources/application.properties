# ===========================
# FitLog Application Config
# ===========================

# Server
server.port=8081

# ===========================
# MySQL Database Config
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3307/fitlog_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / Hibernate Config
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# App Name
# ===========================
spring.application.name=FitLog
